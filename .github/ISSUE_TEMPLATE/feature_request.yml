name: Feature request
description: An idea for kyuar
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could kyuar help? Sketches and examples are welcome.
    validations:
      required: true
